<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subagent City</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1><img src="icon.svg" alt="" width="20" height="20"> Subagent City</h1>
    <p class="summary" id="summary" aria-live="polite">Reading sessions…</p>
    <span class="live" id="live"><i aria-hidden="true"></i> live</span>
  </header>
  <main class="layout">
    <section class="map" aria-label="Map of sessions and their subagents">
      <canvas id="map" aria-hidden="true"></canvas>
      <div class="tip" id="tip" role="tooltip" hidden></div>
      <div class="empty" id="empty" hidden>
        <strong>No open Claude Code sessions</strong>
        <span>Start one with <code>claude</code> in a terminal or in the Claude app; it shows up here within a few seconds.</span>
      </div>
      <div class="controls">
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" id="fit">Fit</button>
      </div>
      <p class="hint">Drag to pan · scroll to zoom · click a node for details</p>
    </section>
    <aside class="panel" aria-label="Subagents">
      <ul class="sessions" id="sessions"></ul>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
